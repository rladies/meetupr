url: https://rladies.org/meetupr/
template:
  package: rladiesdocs
  bootstrap: 5

logo:
  image: man/figures/logo.png
  href: https://rladies.org/meetupr

navbar:
  components:
    articles:
      text: Tutorials
      href: articles/index.html
    news:
      text: News
      href: news/index.html

articles:
  - title: Get Started
    contents: meetupr
  - title: Advanced Topics
    contents:
      - graphql
      - introspection
      - advanced-auth
  - title: Use Cases
    contents: rladies

reference:
  - title: Authentication
    desc: Functions for authenticating and verification
    contents:
      - meetupr_sitrep
      - contains("auth")
      - starts_with("has")
      - meetupr_client
      - contains("_ci")
      - meetupr_credentials
      - use_gha
  - title: Retrieving data and working with data
    desc: |
      Functions for retrieving data
    contents:
      - starts_with("get")
      - starts_with("find")
  - title: Query functions
    desc: Functions enabling querying of data
    contents:
      - meetupr_req
      - meetupr_query
  - title: Introspection
    desc: Functions for introspection
    contents:
      - starts_with("meetupr_schema")
      - contains("debug")

query proEvents(
  $urlname: ID!,
  $first: Int = 1000,
  $cursor: String
  $date_after: DateTime
  $date_before: DateTime
  $status: [String!]
  ) {
  proNetwork(urlname: $urlname) {
    eventsSearch(
      input: {
        after: $cursor, 
        first: $first, 
        filter: {
          eventDateMax: $date_before
          eventDateMin: $date_after
          status: $status
          }
        }
      ) {
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
      edges {
        node {
          id
          title
          description
          status
          dateTime
          duration
          eventUrl
          featuredEventPhoto {
            id
            baseUrl
            highResUrl
            standardUrl
            thumbUrl
          }
          rsvps {
            yesCount
            waitlistCount
            totalCount
          }
          venues {
            id
            name
            address
            city
            state
            country
            lat
            lon
            postalCode
            venueType
          }
          group {
            name
            urlname
          }
          << extra_graphql >>
        }
      }
    }
  }
}
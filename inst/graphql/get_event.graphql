query getEvent($id: ID!) {
  event(id: $id) {
    id
    title
    eventUrl
    createdTime
    status
    dateTime
    duration
    description
    
    group {
      id
      name
      urlname
    }
    
    venues {
      id
      name
      address
      city
      state
      postalCode
      country
      lat
      lon
      venueType
    }
    
    rsvps(first: 1) {
      totalCount
    }
    
    featuredEventPhoto {
      baseUrl
    }
    
    feeSettings {
      required
      amount
      currency
      accepts
      refundPolicy {
        notes
        days
      }
    }
    
    << extra_graphql >>
  }
}
# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches:
      - main
    paths:
      - "README.Rmd"
      - "man/rmd-fragments/**"
      - "_vcr"

name: Render README

jobs:
  render-rmarkdown:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.JINX_APP_ID }}
          private-key: ${{ secrets.JINX_PRIVATE_KEY }}
          owner: rladies

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: readme-1
          extra-packages: |
            devtools
            rmarkdown
        env:
          GITHUB_PAT: ${{ steps.app-token.outputs.token }}

      - name: Render Rmarkdown files
        shell: Rscript {0}
        run: |
          devtools::build_readme()

      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --local user.name "Jinx[bot]"
          git config --local user.email "jinx@rladies.org"
          git commit README.md -m 'Re-build README' || echo "No changes to commit"
          git push origin || echo "No changes to commit"

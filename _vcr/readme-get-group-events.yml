        time we will have a different event, which is going to be really interesting
        and informative for those who like to master the balance of life and work,
        their energy, happiness, and self-awareness.\\n\\nNancy is an expert Trainer,
        Speaker, Coach, and Counselor with more than 30 years in the business world
        specializing in sales, marketing and communication skills.\\n\\nhttps://www.nancycooklin.com/en/\\n\\nDescription:\\n\\nIn
        an always more digitalized world it is fundamental to stay centered and aligned.\\nWhat
        really makes us stand out is what we represent as human beings.\\nThis is
        self-leadership, knowing to manage ourselves to create a better world where
        other people want to belong. Stepping outside of our comfort zone to experience
        new emotions and experiences. This is what Nancy means by Create Yourself!\\n\\nThis
        will be a talk with some practical exercises and material to think about.\\n\\nBased
        on a Leadership Model, we’ll discuss the four abilities that it entails:\\n\\n1)
        Personal abilities: (Self)\\n\\n- Being aware of our own map of the world\\n-
        Be coherent with the message and brand that we want to communicate\\n- The
        response-ability of our results\\n- Emotional Intelligence\\n\\n2) Strategic
        abilities: (Goals)\\n\\n- Having clarity on our purpose - what drives us\\n-
        Focus on our vision having set goals with an action plan\\n\\n3) Relational
        abilities: (Others)\\n\\n- Have the skills to communicate effectively (first,
        understand others to then make ourselves understood)\\n- Awareness that to
        motivate others first we need to understand their model of the world.\\n\\n4)
        Systemic thinking ability: (System)\\n\\n- Be aware of the system of which
        we are part of\\n- The more we grow, the more the system grows\\n\\nTake aways:
        motivation, the concept of being responsible for their own happiness. Step
        outside of your comfort zone and try new ways, understand the change process
        and why it’s hard.\",\"group\":{\"id\":\"5190472\",\"name\":\"R-Ladies San

        Transitioning into the tidyverse\",\"eventUrl\":\"https://www.meetup.com/rladies-san-francisco/events/265100301/\",\"createdTime\":\"2019-09-23T15:28:24-04:00\",\"status\":\"PAST\",\"dateTime\":\"2019-10-16T18:00:00-07:00\",\"duration\":\"PT2H\",\"description\":\"\\\"Transitioning
        into the tidyverse\\\"\\n\\n• Description:\\nMost people who learned R before
        the tidyverse have likely started to feel a nibble of pressure to get aboard
        the tidyverse train. Sadly a fact of human nature is that once you’re comfortable
        doing something a certain way, it’s hard to find the motivation to learn a
        different way of doing something that you already know how to do. While the
        tidyverse is primarily made up of a set of super useful R packages (ggplot2,
        dplyr, purrr, tidyr, readr, tibble), it is also a way of thinking about implementing
        “tidy” data analysis. If you combine tidy thinking with the tidy packages,
        you will inevitably become a master of tidy analysis. This talk will provide
        a guide for easing into the tidyverse for new users by first focusing on piping,
        dplyr, and ggplot2, and then providing short summaries and references for
        the remaining packages that form the tidyverse (and how they play together).
        Additional resources for continuing your tidyverse journey will be provided.\\n\\n•
        Target audience:\\nPeople familiar with base R who want to familiarize themselves
        with the tidyverse, as well as those who have a little experience with the
        tidyverse and want a big picture of how it all fits together.\\n\\nThe talk
        will be a combination of slides and live-coding, and is based on my two-part
        blog post on the tidyverse: http://www.rebeccabarter.com/blog/2019-08-05_base_r_to_tidyverse/
        and http://www.rebeccabarter.com/blog/2019-08-05_base_r_to_tidyverse_pt2/\\n\\n•
        Bio:\\nRebecca is a Statistics PhD Student at UC Berkeley as well as a Data
        Science Fellow at the Berkeley Institute for Data Science (BIDS). Her dual
        passions are explaining “seemingly complicated” concepts to others in plain
        English, and exploring and presenting the stories that underlie complex datasets.
        She has dabbled in writing software as the author of the superheat R package
        for creating beautiful and customizable heatmaps in R. Rebecca also writes
        blog posts about R and statistics over at her website, www.rebeccabarter.com.
        When she's not doing R or stats stuff, she can usually be found climbing rocks
        somewhere, taking photos of beautiful places, or throwing wonky mugs and bowls
        at the pottery studio!\\n\\n================================================\\nAGENDA:\\n5:30pm
        - 6pm: Help with the setup (install R packages and anything else that is needed

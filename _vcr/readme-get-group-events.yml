        A friendly introduction to writing an R package (+ bonus talk)\",\"eventUrl\":\"https://www.meetup.com/rladies-san-francisco/events/258349273/\",\"createdTime\":\"2019-01-24T00:18:09-05:00\",\"status\":\"PAST\",\"dateTime\":\"2019-02-07T18:00:00-08:00\",\"duration\":\"PT2H\",\"description\":\"MAIN
        TALK (Workshop): \\\"A friendly introduction to writing an R package\\\"\\n\\n•
        Description:\\n\\nHave you ever moved house? Imagine moving your house one.
        Item. At. A. Time. Super painful! The better way is to put things in boxes
        where like things go together, and they are much easier to transport. Writing
        an R package is a similar thing. It’s the ideal way to transport and share
        your code. As Hilary Parker said in her famous blog post: “How to write an
        R package from scratch”:\\nSeriously, it doesn’t have to be about sharing
        your code (although that is an added benefit!). It is about saving yourself
        time. (n.b. this is my attitude about all reproducibility.)\\nThis workshop
        is designed to have people come out feeling that making an R package is useful
        and worthwhile learning. You will not walk out as complete masters, but you
        will know how to get started with the basics, and where to go from here.\\n\\n•
        Speaker Bio:\\n\\nNick Tierney recently completed his PhD in Statistics at
        QUT, and is now a Research Fellow in Statistics at Monash University in Australia,
        where he works with [Rob Hyndman](https://robjhyndman.com/ ) and [Di Cook](http://dicook.org/
        ) in the NUMBAT group. Nick’s research aims to improve data analysis workflow.
        His work so far has focussed on the importance of knowing your data ( [`visdat`](https://github.com/njtierney/visdat)
        ), and on creating principles and tools that make it easier to work with,
        explore, and model missing data ( [`naniar`](https://github.com/njtierney/naniar)).\\n\\nNick
        loves the R programming language https://www.r-project.org/ and how it has
        transformed his world. He is a proud member of the [rOpenSci](https://ropensci.org/
        ) community, a collective that works to make science open using R, and co-host
        a podcast with [Saskia Freytag](https://twitter.com/trashystats ) about everything
        #rstats named [\\\"Credibly Curious\\\"](https://soundcloud.com/crediblycurious
        ).\\n\\nNick a keen rock climber, loves karaoke, and is a coffee geek.\\n\\nPrerequisites
        to attend:\\n- If you are curious about how to create an R package\\n- If
        you have some experience using R\\n\\nWhat do you need to attend:\\n- Your
        own laptop\\n- R (version 3.5.0 or higher) (https://cloud.r-project.org/ )\\n-
        RStudio (latest stable version) - https://www.rstudio.com/products/rstudio/download/#download\\nIn
        R, run:\\n- install.packages(“devtools”)\\n- install.packages(“rmarkdown”)\\n\\n--------------------------------------------------------------------\\n\\nOPENING
        TALK: \\\"A/B testing for logistics with R\\\" (by Jingjie Xiao)\\n\\n• Description:\\nHow
        randomized, controlled experiments and multivariate regression with R are
        used to continuously improve the grocery delivery engine @ Instacart\\n\\n•
        Speaker Bio:\\nJingjie currently works as a data scientist on emerging products
        team at Instacart. She has a PhD in operations research at Purdue and studied
        automation at Tsinghua.\\n\\n================================================\\nAGENDA:\\n5:30pm
        - 6pm: Help with the setup (install R packages and anything else that is needed
        for the workshop)\\n6pm - 6:20pm: Networking\\n6:20pm - 6:35pm: Opening Talk\\n6:35pm
        - 7:45pm: Workshop\\n7:45pm - 8pm: Networking\\n\\n================================================\\n•

        office in San Francisco.\\n\\nFor this first meetup, we'll do an introduction
        to R. We'll go over the following topics:\\n\\ninstalling R setting up an
        R environment (RStudio) basic commands (open files, simple dataset manipulation,
        simple plots, etc) loading packages the help function and how to read its
        output\\n\\nAll you need is your laptop and charger.\\n\\nWe look forward
        to seeing you!\",\"group\":{\"id\":\"5190472\",\"name\":\"R-Ladies San Francisco\",\"urlname\":\"rladies-san-francisco\"},\"venues\":[{\"id\":\"7927512\",\"name\":\"Google
        San Francisco\",\"address\":\"4th floor, 345 Spear Street\",\"city\":\"San
        Francisco\",\"state\":\"CA\",\"postalCode\":\"94105\",\"country\":\"us\",\"lat\":37.789761,\"lon\":-122.390175,\"venueType\":\"\"}],\"rsvps\":{\"totalCount\":15},\"featuredEventPhoto\":null,\"feeSettings\":null}},{\"cursor\":\"MTAxMDMyNDYyOjEzNjA1MzM2MDAwMDA=\",\"node\":{\"id\":\"101032462\",\"title\":\"R
        & Coffee\",\"eventUrl\":\"https://www.meetup.com/rladies-san-francisco/events/101032462/\",\"createdTime\":\"2013-01-23T14:12:43-05:00\",\"status\":\"PAST\",\"dateTime\":\"2013-02-10T14:00:00-08:00\",\"duration\":\"PT3H\",\"description\":\"Hello
        R-ladies,\\n\\nIt's time to get together again!\\nIn this second meetup I'd
        like to do something more informal.\\nLet's meet in the Arlequin Cafe ( http://www.arlequincafe.com/
        ) on Sunday - February 10th, for a few hours, to have fun while learning R,
        to exchange knowledge, to work on our personal projects or just to meet other
        R-ladies.\\n\\nWe will work on the introductory tutorial to the R language
        offered by the Code School in partnership with O'Reilly ( http://tryr.codeschool.com/
        ).\\n\\nIf you are an intermediate or advanced R user, you can work on your
        own project, study any topic you are interested in or help the beginners.\",\"group\":{\"id\":\"5190472\",\"name\":\"R-Ladies
        San Francisco\",\"urlname\":\"rladies-san-francisco\"},\"venues\":[{\"id\":\"727764\",\"name\":\"Arlequin
        Cafe\",\"address\":\"384 Hayes St\",\"city\":\"San Francisco\",\"state\":\"CA\",\"postalCode\":\"94101\",\"country\":\"us\",\"lat\":37.776934,\"lon\":-122.422814,\"venueType\":\"\"}],\"rsvps\":{\"totalCount\":17},\"featuredEventPhoto\":null,\"feeSettings\":null}},{\"cursor\":\"MTE0MDY4MTAyOjEzNjY4NTE2MDAwMDA=\",\"node\":{\"id\":\"114068102\",\"title\":\"Tech
        in Motion SF Presents: Women in Engineering!\",\"eventUrl\":\"https://www.meetup.com/rladies-san-francisco/events/114068102/\",\"createdTime\":\"2013-04-12T17:43:26-04:00\",\"status\":\"PAST\",\"dateTime\":\"2013-04-24T18:00:00-07:00\",\"duration\":\"PT3H\",\"description\":\"Please
        RSVP here: http://www.meetup.com/TechinMotionSF/events/112869962/\\n\\nJoin
        us at San Francisco's 7th Tech in Motion event! RichRelevance (http://www.richrelevance.com/)
        will be opening their doors to techies in the area so that guests can meet
        and network with others of similar interest! Don't be discouraged by the event
        name! Everyone is welcome. Enjoy a free happy hour, along with some delicious
        snacks, while talking tech. Three guest speakers will follow, giving informative
        and inspirational talks as women who have excelled in their career paths.Workbridge
        Associates (http://www.workbridgeassociates.com/locations/san-francisco) and
        Jobspring Partners (http://www.jobspringpartners.com/locations/san-francisco)
        will be onsite to offer any career consulting advice or insight. We can't
        wait to see you there on Wednesday, April 24th! Please bring a friend! Make
        sure to follow us on twitter for updates, reminders, and live pictures on
        the meetup:@WorkbridgeSF (https://twitter.com/WorkbridgeSF) and @JobspringSF
        (https://twitter.com/JobspringSF).\\n\\nMeet your speakers:\\n\\nGabriela
        de Queiroz (http://www.linkedin.com/profile/view?id=122680955&authType=NAME_SEARCH&authToken=r64L&locale=en_US&srchid=36339d30-2cda-4c82-b859-c16fca68eedd-0&srchindex=1&srchtotal=63&goback=.fps_PBCK_gabriela+de+queiroz_*1_*1_*1_*1_*1_*1_*2_*1_Y_*1_*1_*1_false_1_R_*1_*51_*1_*51_true_*2_*2_*2_*2_*2_*2_*2_*2_*2_*2_*2_*2_*2_*2_*2_*2_*2_*2_*2_*2_*2&pvs=ps&trk=pp_profile_name_link)
        is a statistician and the founder of R-ladies -- a group to promote R, exchange
        knowledge, and create a network among women. Using statistical tools (such
        as R), she is passionate about making beautiful things and telling stories
        with data. With this explosion in the availability of information, faster
        and more efficient tools are needed to extract meaningful patterns from data.
        She will introduce R, explain why it is so powerful, show some packages for
        visualizing and exploring large data sets, and give examples along with some
        applications.\\n\\nJulia Grace (http://www.linkedin.com/in/juliagrace) was
        the first employee at Tindie (http://tindie.com/) (\\\"Etsy for Hardware Hackers\\\")
        where she is currently the engineering lead. Having an abundance of startup
        experience, she will share her knowledge with us. If you think your company's
        culture is \\\"impromptu nerf gun fights and catered lunch\\\", you're wrong.
        She will talk about what culture really is and how if you don't actively create
        it, it will be created for you.\\n\\nRuma Nair (http://www.linkedin.com/profile/view?id=29205527&locale=en_US&trk=tyah2)
        works as a software engineer at RichRelevance in the platform team. Her work
        includes solving fun problems like scaling the infrastructure, dabbling with
        \\\"Big Data\\\", and improving performance. Ruma will delve into Big Data.\",\"group\":{\"id\":\"5190472\",\"name\":\"R-Ladies
        San Francisco\",\"urlname\":\"rladies-san-francisco\"},\"venues\":[{\"id\":\"12263462\",\"name\":\"RichRelevance\",\"address\":\"633
        Folsom Street, 4th Floor\",\"city\":\"San Francisco\",\"state\":\"CA\",\"postalCode\":\"94107\",\"country\":\"us\",\"lat\":37.784691,\"lon\":-122.397369,\"venueType\":\"\"}],\"rsvps\":{\"totalCount\":13},\"featuredEventPhoto\":null,\"feeSettings\":null}},{\"cursor\":\"MTE2Nzg1NTIyOjEzNjc4ODg0MDAwMDA=\",\"node\":{\"id\":\"116785522\",\"title\":\"R

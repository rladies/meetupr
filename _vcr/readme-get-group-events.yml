        to R (beginners and pre-beginners)\",\"eventUrl\":\"https://www.meetup.com/rladies-san-francisco/events/85320382/\",\"createdTime\":\"2012-10-03T13:17:44-04:00\",\"status\":\"PAST\",\"dateTime\":\"2012-10-31T18:00:00-07:00\",\"duration\":\"PT2H\",\"description\":\"Hello

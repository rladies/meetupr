        Analytics: Transforming Social Data into Actionable Insights\",\"eventUrl\":\"https://www.meetup.com/rladies-san-francisco/events/234342330/\",\"createdTime\":\"2016-09-23T00:19:14-04:00\",\"status\":\"PAST\",\"dateTime\":\"2016-10-13T18:00:00-07:00\",\"duration\":\"PT3H\",\"description\":\"R-Ladies
        San Francisco celebrates our 4-Year Anniversary with the workshop:\\n\\nhttp://photos1.meetupstatic.com/photos/event/5/0/3/c/600_454400540.jpeg\\n\\nProduct
        Analytics: Transforming Social Data into Actionable Insights\\n\\nInterested
        in Product Analytics?\\n\\nThe field of data science has been rapidly expanded
        in recent years, with much of the growth in product analytics.\\n\\nData scientists
        are coming from a variety of backgrounds, many without prior experience dealing
        with human behavior.\\n\\nDomain knowledge is vital to defining a metric/outcomes,
        feature selection and building a model.\\n\\nWhat’s unique about user data?
        A lot of things – social processes are complex, undefined and context matters.\\n\\nJoin
        this engaging workshop with Joanne Rodrigues where she discusses tactics for
        exploring social processes. She’ll explore practical techniques for dealing
        with user data demonstrating them through entertaining examples and focusing
        on the future of social data. You'll leave the session with a heightened appreciation
        for social data and an excitement to apply what you learned.\\n\\nAbout the
        speaker:\\n\\nJoanne Rodrigues is a data scientist with three masters in mathematics,
        demography and political science. She worked at a number of startups, including
        most recently as the first data scientist at MeYou Health, creating frameworks
        to define and measure social dynamics and building all their predictive models.
        She is currently working on a book on Product Analytics and an e-book on R/R-Shiny.\\n\\nPRE-REQUISITE\\n\\nThis
        talk assumes a basic understanding of algorithms and statistics. The intended
        audience is data scientists or aspiring data scientists with a background
        in analytics. It also assumes a basic understanding of how to work with data
        frames in R.\\n\\nMake sure to have R and RStudio installed.\\n\\nLaptops
        Required\\n\\n------------------------------------------------------------------------\\n\\nSchedule:\\n\\n6:00pm
        - 6:15pm: Networking\\n\\n6:15pm - 6:30pm: Setting up\\n\\n6:30pm: Tutorial

        R-ladies,\\n\\nIt's time to get together again!\\n\\nLet's meet on Monday
        - May 6th, for a few hours, to have fun while learning R, to exchange knowledge,
        to work on your personal projects or just to have coffee together and meet
        other R-ladies.\\n\\nI will provide online tutorials (links) and books so
        you can work on or you can bring your own book about R (that one that you
        bought but you never had time to sit and study it).\\n\\nIf you are an intermediate
        or advanced R user, you can work on your own project, study any topic you
        are interested in or help the beginners.\\n\\nBring your computer!\\n\\nInstall
        R: http://cran.cnr.berkeley.edu/\\n\\nIf you'd like to install RStudio too,
        the link is here: http://www.rstudio.com/ide/download/desktop\\n\\nP.S: This
        place has tables in the back too. So if you don't find us in the front, look
        for us in the back.\",\"group\":{\"id\":\"5190472\",\"name\":\"R-Ladies San

        analysis in R via stan + a bonus talk\",\"eventUrl\":\"https://www.meetup.com/rladies-san-francisco/events/262662040/\",\"createdTime\":\"2019-06-26T23:11:16-04:00\",\"status\":\"PAST\",\"dateTime\":\"2019-07-17T18:00:00-07:00\",\"duration\":\"PT2H\",\"description\":\"MAIN
        TALK (Workshop): “Bayesian Analysis in R via Stan”\\n\\nDescription\\n\\nBayesian
        analysis in R has never been so easy. After an overview on Bayesian statistics,
        Alice will introduce the Stan's probabilistic programming language and how
        to run .stan files from R via rstan. She will also explore the brms and rstanarm
        packages, giving pros and cons and when to use one vs. the other, examples
        included. By the end of the workshop you will master concepts like prior distributions
        and you will be able to easily implement your Bayesian regressions.\\n\\nIn
        this workshop you are encouraged to code along with Alice. Please either come
        with RStudio installed on your laptop or have access to it via your browser
        (through Jupyter Notebook for example). Required libraries: tidyverse, rstan,
        rstantools, brms, rtanarm, shiny.\\nAll levels are welcome!\\n\\nSpeaker bio\\n\\nAlice
        has recently earned her PhD in Demography from the University of Geneva in
        Switzerland. Her areas of research are population modeling and forecasts,
        with a special focus on migration. Her first area of expertise is gelato,
        but she also loves to play around with Bayesian Statistics :)\\n\\n------------------------------------------------------------------------------------------------------\\n\\nOPENING
        TALK: “Running Python in R with reticulate”\\n\\nDescription\\n\\nR & Python
        are two of the most popular languages used in analytics. Each have their unique
        advantages, and it's now easier than ever before to use them both within the
        same environment.\\n\\nIn this talk, we'll learn how to use `reticulate`,
        a tool for using Python from within R. We'll do this by walking through a
        common data science use case so you leave equipped to begin using this within
        your own workflows.\\n\\nSpeaker bio\\n\\nMatthew is on the data science team
        at Instacart, a grocery delivery company headquartered in San Francisco. A
        brand marketer turned data scientist, he's always on the hunt for ways to
        make analytics more approachable to both himself and the stakeholders that
        he supports. In his spare time, he works on his Rocket League skills and is
        currently searching for something to fill the void left by Game of Thrones.\\n\\n========================================================\\n\\nAGENDA:\\n6pm
        - 6:20pm: Networking and help with installation (download RStudio, packages,
        etc)\\n6:20pm - 6:35pm: Opening Talk: Running Python in R with reticulate\\n6:35pm
        - 7:45pm: Workshop: Bayesian Analysis in R via Stan\\n7:45pm - 8pm: Networking\\n\\n========================================================\\n\\nImportant

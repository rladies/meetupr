        Join us on Sept 9th at 4pm PT live on our YouTube channel\\n➡️ Youtube Link:
        https://bit.ly/ai-inclusive-youtube\\n\\n================================================\\n\\nData
        Storytelling with Effective Data Visualization Techniques\\n\\nAbstract:\\nIf
        a data scientist spends 80% of their time cleaning the data and 20% of their
        time performing analysis, where is the allocated time for the effective communication
        of your results? Storytelling is an integral part of conveying your findings
        and data visualization is a key tool for the job. In this session we will
        discuss data visualization guidelines, tips and tricks as well as available
        resources to help you tell your story with data.\\n\\n• Bio:\\nLaura Ellis
        is a senior technical staff member (STSM) at IBM is the Analytics Architect
        for the IBM Cloud internal data platform. Her goal is to make data science
        and analytics accessible to everyone. Over the past 15 years, Laura has worked
        with teams to deliver a wide range of business solutions built on a diverse
        analytic stack including databases, business intelligence, data science, predictive
        modeling and real time event streaming. She holds a Bachelor of Engineering
        Science from the University of Western Ontario and a Master of Science in
        Predictive Analytics from Northwestern University. Laura is passionate about
        using data to solve business problems and helping women grow their careers.\\nCheck

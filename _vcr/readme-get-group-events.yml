        appropriate by the Organizer, regardless of event registration, meetup membership
        or other condition.\\n\\n------------------------------------------------------------------------------\\n\\nWe
        are emphatically queer and trans friendly.\",\"group\":{\"id\":\"5190472\",\"name\":\"R-Ladies

        A friendly introduction to writing an R package (+ bonus talk)","eventUrl":"https://www.meetup.com/rladies-san-francisco/events/258349273/","createdTime":"2019-01-24T00:18:09-05:00","status":"PAST","dateTime":"2019-02-07T18:00:00-08:00","duration":"PT2H","description":"MAIN
        TALK (Workshop): \"A friendly introduction to writing an R package\"\n\n•
        Description:\n\nHave you ever moved house? Imagine moving your house one.
        Item. At. A. Time. Super painful! The better way is to put things in boxes
        where like things go together, and they are much easier to transport. Writing
        an R package is a similar thing. It’s the ideal way to transport and share
        your code. As Hilary Parker said in her famous blog post: “How to write an
        R package from scratch”:\nSeriously, it doesn’t have to be about sharing your
        code (although that is an added benefit!). It is about saving yourself time.
        (n.b. this is my attitude about all reproducibility.)\nThis workshop is designed
        to have people come out feeling that making an R package is useful and worthwhile
        learning. You will not walk out as complete masters, but you will know how
        to get started with the basics, and where to go from here.\n\n• Speaker Bio:\n\nNick
        Tierney recently completed his PhD in Statistics at QUT, and is now a Research
        Fellow in Statistics at Monash University in Australia, where he works with
        [Rob Hyndman](https://robjhyndman.com/ ) and [Di Cook](http://dicook.org/
        ) in the NUMBAT group. Nick’s research aims to improve data analysis workflow.
        His work so far has focussed on the importance of knowing your data ( [`visdat`](https://github.com/njtierney/visdat)
        ), and on creating principles and tools that make it easier to work with,
